<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Parkinson Hassas Ritim & Geçiş Egzersizi</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a237e; color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; font-family: sans-serif; text-align: center;
      }
      #ui-overlay {
        position: fixed; top: 10px; left: 10px; color: #1a237e;
        font-family: sans-serif; font-size: 20px; font-weight: bold;
        z-index: 999; pointer-events: none; background: rgba(255,255,255,0.8);
        padding: 10px; border-radius: 8px;
      }
      button {
        padding: 15px 30px; font-size: 18px; border: none;
        border-radius: 25px; background: #ff6f00; color: white;
        cursor: pointer; margin-top: 20px; font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div id="ui-overlay" style="display: none;">
      <div>Süre: <span id="ui-timer">60</span> sn</div>
      <div>Mod: <span id="ui-mode">Sıralı</span></div>
      <div>Skor: <span id="ui-score">0</span></div>
    </div>

    <div id="start-screen">
      <h2>Parkinson Ritim Egzersizi (40 BPM)</h2>
      <p style="max-width: 400px; padding: 0 20px;">
        Hız: 40 BPM. Geçiş fazında beliren <b>kalın mavi çizgiyi</b> takip ederek yeni davula odaklanın.
      </p>
      <button id="start-btn">EGZERSİZİ BAŞLAT</button>
    </div>

    <a-scene vr-mode-ui="enabled: false">
      <a-sky color="#ECEFF1"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#CFD8DC"></a-plane>

      <a-cylinder id="drum-0" class="drum targetable" position="-2.2 2.2 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-0" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-cylinder id="drum-1" class="drum targetable" position="2.2 2.2 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-1" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-cylinder id="drum-2" class="drum targetable" position="2.2 0.8 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-2" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-cylinder id="drum-3" class="drum targetable" position="-2.2 0.8 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-3" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-box id="line-0-1" class="line targetable" position="0 2.2 -3.95" width="3.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-1-2" class="line targetable" position="2.2 1.5 -3.95" width="0.15" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-2-3" class="line targetable" position="0 0.8 -3.95" width="3.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-3-0" class="line targetable" position="-2.2 1.5 -3.95" width="0.15" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      
      <a-box id="line-0-2" class="line targetable" position="0 1.5 -3.95" rotation="0 0 -17" width="4.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-1-3" class="line targetable" position="0 1.5 -3.95" rotation="0 0 17" width="4.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      
      <a-box id="line-0-3" class="line targetable" position="-2.2 1.5 -3.95" width="0.15" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-1-0" class="line targetable" position="0 2.2 -3.95" width="3.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-2-1" class="line targetable" position="2.2 1.5 -3.95" width="0.15" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-3-2" class="line targetable" position="0 0.8 -3.95" width="3.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-2-0" class="line targetable" position="0 1.5 -3.95" rotation="0 0 -17" width="4.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-3-1" class="line targetable" position="0 1.5 -3.95" rotation="0 0 17" width="4.6" height="0.15" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" position="0 1.5 0">
        <a-cursor id="my-cursor" raycaster="objects: .targetable; interval: 20" fuse="false" color="#D50000" scale="2 2 2"></a-cursor>
      </a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const uiOverlay = document.getElementById('ui-overlay');
      const uiTimer = document.getElementById('ui-timer');
      const uiMode = document.getElementById('ui-mode');
      const uiScore = document.getElementById('ui-score');

      let score = 0;
      let timeLeft = 60;
      let gameInterval, beatInterval, scoreInterval;
      let audioCtx = null;
      
      const drums = [document.getElementById('drum-0'), document.getElementById('drum-1'), document.getElementById('drum-2'), document.getElementById('drum-3')];
      const masks = [document.getElementById('mask-0'), document.getElementById('mask-1'), document.getElementById('mask-2'), document.getElementById('mask-3')];

      let activeIndex = 0;
      let nextIndex = 1;
      let beatCount = 0;
      let currentTargetObject = null;
      let activeLine = null;

      // 40 BPM Ayarları (1 vuruş = 1500 milisaniye)
      const BEAT_DURATION = 1500; 

      startBtn.addEventListener('click', () => {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(state => {
            if (state === 'granted') initGame();
            else alert('Jiroskop izni gerekli!');
          }).catch(console.error);
        } else {
          initGame();
        }
      });

      function initGame() {
        startScreen.style.display = 'none';
        uiOverlay.style.display = 'block';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // İlk davul tamamen yeşil başlar
        masks[activeIndex].setAttribute('scale', '1 1 1');

        gameInterval = setInterval(updateTimer, 1000); // Saat geri sayımı 1 sn kalır
        beatInterval = setInterval(handleBeat, BEAT_DURATION); // Ritim 40 BPM (1.5 saniyede bir)
        setupScoreDetection();
      }

      function playMetronomeSound(pitch) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime); 
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }

      function updateTimer() {
        timeLeft--;
        uiTimer.textContent = timeLeft;
        if (timeLeft <= 30) uiMode.textContent = "Rastgele";
        if (timeLeft <= 0) endGame();
      }

      function handleBeat() {
        let currentCycleBeat = (beatCount % 3) + 1;

        if (currentCycleBeat === 1) {
          playMetronomeSound(150);
          // Her döngü başında aktif olanın tam yeşil, diğerlerinin sıfır olduğundan emin ol (Kesin Eşitleme)
          masks.forEach((m, idx) => {
            m.setAttribute('scale', idx === activeIndex ? '1 1 1' : '0 0 1');
          });
        } 
        else if (currentCycleBeat === 2) {
          playMetronomeSound(150);
          calculateNextTarget();
        } 
        else if (currentCycleBeat === 3) {
          playMetronomeSound(300); // Geçiş uyarısı tizi

          // Kusursuz JS Tabanlı Boyut Geçişi (Tam 1.5 saniye sürecek)
          animateTransition(activeIndex, nextIndex, BEAT_DURATION);

          // Kalın Çizgiyi Yak (Fade In)
          let lineId = `line-${activeIndex}-${nextIndex}`;
          activeLine = document.getElementById(lineId);
          if (activeLine) {
            activeLine.setAttribute('material', 'opacity', '0.9');
          }
        }

        beatCount++;

        if (currentCycleBeat === 3) {
          // Geçiş fazı (1.5 saniye) bittiğinde çizgiyi kapat ve indeksleri kaydır
          setTimeout(() => {
            if (activeLine) activeLine.setAttribute('material', 'opacity', '0');
            activeIndex = nextIndex;
          }, BEAT_DURATION - 20);
        }
      }

      // A-Frame animasyon motorundaki donmaları engelleyen JS Yumuşak Geçiş Fonksiyonu
      function animateTransition(oldIdx, newIdx, duration) {
        let startTime = performance.now();

        function step(now) {
          let progress = (now - startTime) / duration;
          if (progress > 1) progress = 1;

          // Eski daire küçülür (1'den 0'a)
          let oldScale = 1 - progress;
          masks[oldIdx].setAttribute('scale', `${oldScale} ${oldScale} 1`);

          // Yeni daire büyür (0'dan 1'ye - Tam Yeşil Olma Garantisi)
          let newScale = progress;
          masks[newIdx].setAttribute('scale', `${newScale} ${newScale} 1`);

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            // Tam bitiş noktasında garanti eşitleme
            masks[oldIdx].setAttribute('scale', '0 0 1');
            masks[newIdx].setAttribute('scale', '1 1 1');
          }
        }
        requestAnimationFrame(step);
      }

      function calculateNextTarget() {
        if (timeLeft > 30) {
          nextIndex = (activeIndex + 1) % drums.length;
        } else {
          do {
            nextIndex = Math.floor(Math.random() * drums.length);
          } while (nextIndex === activeIndex);
        }
      }

      function setupScoreDetection() {
        const targets = document.querySelectorAll('.targetable');
        targets.forEach(target => {
          target.addEventListener('mouseenter', () => { currentTargetObject = target; });
          target.addEventListener('mouseleave', () => { if (currentTargetObject === target) currentTargetObject = null; });
        });

        scoreInterval = setInterval(() => {
          if (!currentTargetObject || timeLeft <= 0) return;
          let currentCycleBeat = ((beatCount - 1) % 3) + 1;

          if (currentCycleBeat !== 3) {
            if (currentTargetObject === drums[activeIndex]) score += 10;
          } else {
            if (currentTargetObject === activeLine) score += 5;
            if (currentTargetObject === drums[nextIndex]) score += 10;
          }
          uiScore.textContent = score;
        }, 100);
      }

      function endGame() {
        clearInterval(gameInterval);
        clearInterval(beatInterval);
        clearInterval(scoreInterval);
        masks.forEach(m => m.setAttribute('scale', '0 0 1'));
        document.querySelectorAll('.line').forEach(l => l.setAttribute('material', 'opacity', '0'));
        alert(`Egzersiz Tamamlandı!\nToplam Skorunuz: ${score}`);
      }
    </script>
  </body>
</html>
