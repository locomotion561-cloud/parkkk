<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Parkinson Ritim Rehabilitasyonu</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <style>
      /* Mobil tarayıcıda izin isteme butonu için şık bir arayüz */
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a237e; color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; font-family: sans-serif;
      }
      button {
        padding: 15px 30px; font-size: 18px; border: none;
        border-radius: 25px; background: #ff6f00; color: white;
        cursor: pointer; margin-top: 20px; font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div id="start-screen">
      <h2>Parkinson Ritim Egzersizi</h2>
      <p>Başlamak ve jiroskopu aktif etmek için butona basın.</p>
      <button id="start-btn">OYUNU BAŞLAT</button>
    </div>

    <a-scene vr-mode-ui="enabled: false">
      
      <a-sky color="#ECEFF1"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#CFD8DC"></a-plane>

      <a-cylinder id="drum-left" class="drum" position="-2 1.5 -4" radius="0.5" height="0.2" rotation="90 0 0" color="#78909C"></a-cylinder>
      <a-cylinder id="drum-center" class="drum" position="0 1.5 -4" radius="0.5" height="0.2" rotation="90 0 0" color="#78909C"></a-cylinder>
      <a-cylinder id="drum-right" class="drum" position="2 1.5 -4" radius="0.5" height="0.2" rotation="90 0 0" color="#78909C"></a-clock>

      <a-light type="ambient" color="#fff"></a-light>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" position="0 1.5 0">
        <a-cursor 
          id="my-cursor"
          raycaster="objects: .drum" 
          fuse="true" 
          fuse-timeout="600"
          color="#FF3D00"
          scale="1.5 1.5 1.5">
        </a-cursor>
      </a-entity>

    </a-scene>

    <script>
      // Mobil cihazlarda jiroskop (DeviceOrientation) izni almak zorunludur.
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const scene = document.querySelector('a-scene');

      startBtn.addEventListener('click', () => {
        // iOS 13+ için jiroskop izni isteme ritüeli
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
              if (permissionState === 'granted') {
                initGame();
              } else {
                alert('Jiroskop izni reddedildi. Oyun çalışmaz.');
              }
            })
            .catch(console.error);
        } else {
          // Android veya masaüstü tarayıcılar için doğrudan başlat
          initGame();
        }
      });

      function initGame() {
        startScreen.style.display = 'none'; // Giriş ekranını gizle
        
        // Oyun mekaniklerini tetikleyen ana döngüyü başlatacağız
        startGameLogic();
      }

      // OYUN MANTIĞI VE RİTİM DÖNGÜSÜ
      let drums = Array.from(document.querySelectorAll('.drum'));
      let activeDrum = null;
      let score = 0;

      function startGameLogic() {
        // Her 2 saniyede bir (Parkinson için ideal bir başlangıç ritmi) bir davul seçeceğiz
        setInterval(activateRandomDrum, 2000);

        // Davullara "bakıldığında" (vurulduğunda) ne olacağını tanımlayalım
        drums.forEach(drum => {
          drum.addEventListener('click', function () {
            if (this === activeDrum) {
              // Doğru davula vuruldu!
              this.setAttribute('color', '#4CAF50'); // Yeşil yap (Başarılı geri bildirim)
              score++;
              console.log("Skor: " + score);
              
              // Kısa süre sonra eski rengine döndür
              setTimeout(() => {
                if(this === activeDrum) this.setAttribute('color', '#78909C');
              }, 300);
            }
          });
        });
      }

      function activateRandomDrum() {
        // Önceki aktif davulu sıfırla
        drums.forEach(d => d.setAttribute('color', '#78909C'));

        // Rastgele yeni bir davul seç
        const randomIndex = Math.floor(Math.random() * drums.length);
        activeDrum = drums[randomIndex];

        // Seçilen davulu PARLAT (Parkinson hastası için net görsel uyarı - Neon Sarı/Turuncu)
        activeDrum.setAttribute('color', '#FFEB3B');
      }
    </script>
  </body>
</html>
