<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Parkinson Ritim, Odak ve Çizgi Takip Egzersizi</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a237e; color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; font-family: sans-serif; text-align: center;
      }
      #ui-overlay {
        position: fixed; top: 10px; left: 10px; color: #1a237e;
        font-family: sans-serif; font-size: 20px; font-weight: bold;
        z-index: 999; pointer-events: none; background: rgba(255,255,255,0.8);
        padding: 10px; border-radius: 8px;
      }
      button {
        padding: 15px 30px; font-size: 18px; border: none;
        border-radius: 25px; background: #ff6f00; color: white;
        cursor: pointer; margin-top: 20px; font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div id="ui-overlay" style="display: none;">
      <div>Süre: <span id="ui-timer">60</span> sn</div>
      <div>Mod: <span id="ui-mode">Sıralı</span></div>
      <div>Skor: <span id="ui-score">0</span></div>
    </div>

    <div id="start-screen">
      <h2>Parkinson Ritim & Çizgi Egzersizi</h2>
      <p style="max-width: 400px; padding: 0 20px;">
        Ritime kulak verin! İmleci yeşil davulda tutun ve yeni davula geçerken **bağlantı çizgilerini takip ederek** ekstra puan kazanın!
      </p>
      <button id="start-btn">EGZERSİZİ BAŞLAT</button>
    </div>

    <a-scene vr-mode-ui="enabled: false">
      <a-sky color="#ECEFF1"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#CFD8DC"></a-plane>

      <a-cylinder id="drum-0" class="drum targetable" position="-2.2 2.2 -4" radius="0.4" height="0.1" rotation="90 0 0" color="#FBC02D"></a-cylinder>
      <a-cylinder id="drum-1" class="drum targetable" position="2.2 2.2 -4" radius="0.4" height="0.1" rotation="90 0 0" color="#FBC02D"></a-cylinder>
      <a-cylinder id="drum-2" class="drum targetable" position="2.2 0.8 -4" radius="0.4" height="0.1" rotation="90 0 0" color="#FBC02D"></a-cylinder>
      <a-cylinder id="drum-3" class="drum targetable" position="-2.2 0.8 -4" radius="0.4" height="0.1" rotation="90 0 0" color="#FBC02D"></a-cylinder>

      <a-entity id="line-0-1" class="line targetable" line="start: -2.2 2.2 -3.9; end: 2.2 2.2 -3.9; color: #78909C"></a-entity>
      <a-entity id="line-1-2" class="line targetable" line="start: 2.2 2.2 -3.9; end: 2.2 0.8 -3.9; color: #78909C"></a-entity>
      <a-entity id="line-2-3" class="line targetable" line="start: 2.2 0.8 -3.9; end: -2.2 0.8 -3.9; color: #78909C"></a-entity>
      <a-entity id="line-3-0" class="line targetable" line="start: -2.2 0.8 -3.9; end: -2.2 2.2 -3.9; color: #78909C"></a-entity>
      
      <a-entity id="line-0-2" class="line targetable" line="start: -2.2 2.2 -3.9; end: 2.2 0.8 -3.9; color: #78909C"></a-entity>
      <a-entity id="line-1-3" class="line targetable" line="start: 2.2 2.2 -3.9; end: -2.2 0.8 -3.9; color: #78909C"></a-entity>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" position="0 1.5 0">
        <a-cursor 
          id="my-cursor"
          raycaster="objects: .targetable; interval: 30" 
          fuse="false"
          color="#D50000"
          scale="2 2 2">
        </a-cursor>
      </a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const uiOverlay = document.getElementById('ui-overlay');
      const uiTimer = document.getElementById('ui-timer');
      const uiMode = document.getElementById('ui-mode');
      const uiScore = document.getElementById('ui-score');

      let score = 0;
      let timeLeft = 60;
      let gameInterval, beatInterval, scoreInterval;
      let audioCtx = null;
      
      const drums = [
        document.getElementById('drum-0'),
        document.getElementById('drum-1'),
        document.getElementById('drum-2'),
        document.getElementById('drum-3')
      ];

      let activeDrum = null;
      let currentDrumIndex = 0;
      let beatCount = 0;
      let currentTargetObject = null; // Şu an imlecin üstünde olduğu nesne

      const COLOR_IDLE = "#FBC02D";
      const COLOR_ACTIVE = "#388E3C";

      startBtn.addEventListener('click', () => {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(state => {
            if (state === 'granted') initGame();
            else alert('Jiroskop izni gerekli!');
          }).catch(console.error);
        } else {
          initGame();
        }
      });

      function initGame() {
        startScreen.style.display = 'none';
        uiOverlay.style.display = 'block';
        
        // Web Audio API Başlatma (Kullanıcı etkileşimi sonrası)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        gameInterval = setInterval(updateTimer, 1000);
        beatInterval = setInterval(handleBeat, 1000); // 60 BPM = 1 Saniyede 1 vuruş
        setupScoreDetection();
      }

      // Web Audio API ile Metronom Sesi Üretme (Tok bir davul vuruşu)
      function playMetronomeSound(isNewDrumBeat) {
        if (!audioCtx) return;
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        // Yeni davula geçiş vuruşu daha tiz (farklı), ara ritim vuruşları daha pes ses çıkarır
        osc.frequency.setValueAtTime(isNewDrumBeat ? 220 : 150, audioCtx.currentTime); 
        osc.type = 'triangle'; // Yumuşak bir vuruş hissi için
        
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); // Sesi hızla söndür
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }

      function updateTimer() {
        timeLeft--;
        uiTimer.textContent = timeLeft;

        if (timeLeft <= 30) {
          uiMode.textContent = "Rastgele";
          uiMode.style.color = "#d32f2f";
        }

        if (timeLeft <= 0) endGame();
      }

      function handleBeat() {
        // Her 3 vuruşta bir yeni davul seçilir
        const isNewDrumBeat = (beatCount % 3 === 0);
        
        if (isNewDrumBeat) {
          selectNextDrum();
        }
        
        // Her saniye (vuruşta) ritm sesini çal
        playMetronomeSound(isNewDrumBeat);
        beatCount++;
      }

      function selectNextDrum() {
        if (activeDrum) activeDrum.setAttribute('color', COLOR_IDLE);

        if (timeLeft > 30) {
          activeDrum = drums[currentDrumIndex];
          currentDrumIndex = (currentDrumIndex + 1) % drums.length;
        } else {
          let randomIndex;
          do {
            randomIndex = Math.floor(Math.random() * drums.length);
          } while (drums[randomIndex] === activeDrum);
          activeDrum = drums[randomIndex];
        }

        activeDrum.setAttribute('color', COLOR_ACTIVE);
        
        // Aktif çizgi rehberini güncelle (Görsel ipucu olarak tüm çizgileri normale döndür)
        document.querySelectorAll('.line').forEach(l => l.setAttribute('line', 'color', '#78909C'));
      }

      function setupScoreDetection() {
        // İmleç takibi için olay dinleyicileri
        const targets = document.querySelectorAll('.targetable');
        
        targets.forEach(target => {
          target.addEventListener('mouseenter', () => {
            currentTargetObject = target;
          });
          target.addEventListener('mouseleave', () => {
            if (currentTargetObject === target) {
              currentTargetObject = null;
            }
          });
        });

        // Skor Hesaplama Döngüsü (Her 100 milisaniyede bir)
        scoreInterval = setInterval(() => {
          if (!currentTargetObject || timeLeft <= 0) return;

          // Durum 1: İmleç aktif (yeşil) davulun içindeyse (Yoğun puan: +10)
          if (currentTargetObject === activeDrum) {
            score += 10;
          } 
          // Durum 2: İmleç herhangi bir bağlantı çizgisinin üzerindeyse (Çizgi takip puanı: +3)
          else if (currentTargetObject.classList.contains('line')) {
            score += 3;
            // Üzerinde olunan çizgiyi anlık mavi yaparak hastaya görsel geri bildirim verelim
            currentTargetObject.setAttribute('line', 'color', '#2196F3');
          }
          
          uiScore.textContent = score;
        }, 100);
      }

      function endGame() {
        clearInterval(gameInterval);
        clearInterval(beatInterval);
        clearInterval(scoreInterval);
        drums.forEach(d => d.setAttribute('color', COLOR_IDLE));
        document.querySelectorAll('.line').forEach(l => l.setAttribute('line', 'color', '#78909C'));
        alert(`Egzersiz Tamamlandı!\nToplam Skorunuz: ${score}`);
      }
    </script>
  </body>
</html>
