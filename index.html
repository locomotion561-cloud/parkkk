<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Parkinson Klinik Rehabilitasyon Platformu - Mesafe Düzeltme</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a237e; color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; font-family: sans-serif; text-align: center;
      }
      #ui-overlay {
        position: fixed; top: 10px; left: 10px; color: #1a237e;
        font-family: sans-serif; font-size: 20px; font-weight: bold;
        z-index: 999; pointer-events: none; background: rgba(255,255,255,0.8);
        padding: 10px; border-radius: 8px;
      }
      .menu-group {
        margin: 15px 0; background: rgba(255,255,255,0.1); 
        padding: 15px; border-radius: 10px; width: 320px;
      }
      label { font-weight: bold; display: block; margin-bottom: 8px; }
      select {
        width: 100%; padding: 10px; font-size: 16px; border-radius: 5px;
        border: none; background: white; color: #1a237e; font-weight: bold;
      }
      button {
        padding: 15px 40px; font-size: 18px; border: none;
        border-radius: 25px; background: #ff6f00; color: white;
        cursor: pointer; margin-top: 20px; font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <div id="ui-overlay" style="display: none;">
      <div>Süre: <span id="ui-timer">60</span> sn</div>
      <div>Vuruş: <span id="ui-beat">1</span> / 4</div>
      <div>Skor: <span id="ui-score">0</span></div>
    </div>

    <div id="start-screen">
      <h2>Parkinson Egzersiz Ayarları</h2>
      
      <div class="menu-group">
        <label for="bpm-select">Egzersiz Hızı (Tempo):</label>
        <select id="bpm-select">
          <option value="30">30 BPM (Çok Yavaş)</option>
          <option value="40" selected>40 BPM (Standart)</option>
          <option value="50">50 BPM (Orta Hızlı)</option>
          <option value="60">60 BPM (Hızlı)</option>
        </select>
      </div>

      <div class="menu-group">
        <label for="size-select">Davul (Hedef) Boyutu:</label>
        <select id="size-select">
          <option value="0.55">Büyük (Kolay Odaklanma)</option>
          <option value="0.40" selected>Orta (Klinik Standart)</option>
          <option value="0.28">Küçük (Zor Kontrol)</option>
        </select>
      </div>

      <button id="start-btn">EKRANI KİLİTLE & BAŞLAT</button>
    </div>

    <a-scene vr-mode-ui="enabled: false">
      <a-sky color="#ECEFF1"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#CFD8DC"></a-plane>

      <a-circle id="drum-0" class="drum targetable" rotation="0 0 0" color="#FBC02D">
        <a-circle id="mask-0" color="#388E3C" scale="0 0 1" position="0 0 0.01"></a-circle>
      </a-circle>

      <a-circle id="drum-1" class="drum targetable" rotation="0 0 0" color="#FBC02D">
        <a-circle id="mask-1" color="#388E3C" scale="0 0 1" position="0 0 0.01"></a-circle>
      </a-circle>

      <a-circle id="drum-2" class="drum targetable" rotation="0 0 0" color="#FBC02D">
        <a-circle id="mask-2" color="#388E3C" scale="0 0 1" position="0 0 0.01"></a-circle>
      </a-circle>

      <a-circle id="drum-3" class="drum targetable" rotation="0 0 0" color="#FBC02D">
        <a-circle id="mask-3" color="#388E3C" scale="0 0 1" position="0 0 0.01"></a-circle>
      </a-circle>

      <a-box id="dynamic-line" class="targetable" width="0.15" height="1" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true" position="0 0 -100"></a-box>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" position="0 1.5 0">
        <a-cursor id="my-cursor" raycaster="objects: .targetable; interval: 15" fuse="false" color="#D50000" scale="2 2 2"></a-cursor>
      </a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const uiOverlay = document.getElementById('ui-overlay');
      const uiTimer = document.getElementById('ui-timer');
      const uiBeat = document.getElementById('ui-beat');
      const uiScore = document.getElementById('ui-score');

      let score = 0;
      let timeLeft = 60;
      let gameInterval, beatInterval, scoreInterval;
      let audioCtx = null;
      let wakeLock = null; 
      
      const drums = [document.getElementById('drum-0'), document.getElementById('drum-1'), document.getElementById('drum-2'), document.getElementById('drum-3')];
      const masks = [document.getElementById('mask-0'), document.getElementById('mask-1'), document.getElementById('mask-2'), document.getElementById('mask-3')];
      const dynamicLine = document.getElementById('dynamic-line');

      let activeIndex = 0;
      let nextIndex = 1;
      let beatCount = 0;
      let currentTargetObject = null;
      let isTransitioning = false;

      let BEAT_DURATION = 1500; 
      let DRUM_RADIUS = 0.40;
      let MIN_DIST = 1.6; // Güvenli sınır mesafesi burada güncellenecek

      const MIN_X = -2.2, MAX_X = 2.2;
      const MIN_Y = 0.6, MAX_Y = 2.4;
      const FIXED_Z = -4;

      startBtn.addEventListener('click', async () => {
        let selectedBPM = parseInt(document.getElementById('bpm-select').value);
        BEAT_DURATION = (60 / selectedBPM) * 1000;

        DRUM_RADIUS = parseFloat(document.getElementById('size-select').value);
        
        // KRİTİK DÜZELTME: İki daire arasında en az iki daire çapı (4 kat yarıçap) + merkezler arası mesafe için toplam pay
        MIN_DIST = DRUM_RADIUS * 4.5; 

        drums.forEach((drum, idx) => {
          drum.setAttribute('radius', DRUM_RADIUS);
          masks[idx].setAttribute('radius', DRUM_RADIUS);
        });

        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (err) {
          console.warn(err);
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(state => {
            if (state === 'granted') initGame();
            else alert('Jiroskop izni gerekli!');
          }).catch(console.error);
        } else {
          initGame();
        }
      });

      function initGame() {
        startScreen.style.display = 'none';
        uiOverlay.style.display = 'block';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // İlk davul merkezde tam sabit başlar
        drums[activeIndex].setAttribute('position', {x: 0, y: 1.5, z: FIXED_Z});
        masks[activeIndex].setAttribute('scale', '1 1 1');

        // Diğer davulları çakışmasız dağıt
        drums.forEach((drum, idx) => {
          if (idx !== activeIndex) randomizeDrumWithoutOverlap(drum, idx);
        });

        gameInterval = setInterval(updateTimer, 1000);
        beatInterval = setInterval(handleBeat, BEAT_DURATION);
        setupScoreDetection();
      }

      // KESİN ÇAKIŞMA ENGELLEME ALGORİTMASI
      function randomizeDrumWithoutOverlap(targetDrum, targetIdx) {
        let attempts = 0;
        let validPosition = false;
        let newX, newY;

        while (!validPosition && attempts < 200) {
          attempts++;
          newX = Math.random() * (MAX_X - MIN_X) + MIN_X;
          newY = Math.random() * (MAX_Y - MIN_Y) + MIN_Y;
          validPosition = true;

          // Aktif olan dahil tüm diğer davul pozisyonlarını kontrol et
          for (let i = 0; i < drums.length; i++) {
            if (i === targetIdx) continue;
            
            let otherPos = drums[i].getAttribute('position');
            if (!otherPos) continue;

            let dx = newX - otherPos.x;
            let dy = newY - otherPos.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            // Eğer mesafe güvenli sınırdan küçükse bu konumu reddet
            if (dist < MIN_DIST) {
              validPosition = false;
              break;
            }
          }
        }
        targetDrum.setAttribute('position', {x: newX, y: newY, z: FIXED_Z});
      }

      function playMetronomeSound(pitch) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime); 
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }

      function updateTimer() {
        timeLeft--;
        uiTimer.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }

      function handleBeat() {
        let currentCycleBeat = (beatCount % 4) + 1;
        uiBeat.textContent = currentCycleBeat;

        if (currentCycleBeat === 1) {
          isTransitioning = false;
          playMetronomeSound(150);
          masks.forEach((m, idx) => m.setAttribute('scale', idx === activeIndex ? '1 1 1' : '0 0 1'));
          
          // Sarı davulları kesin mesafeli ışınla
          drums.forEach((drum, idx) => { if (idx !== activeIndex) randomizeDrumWithoutOverlap(drum, idx); });
        } 
        
        else if (currentCycleBeat === 2) {
          playMetronomeSound(150);
          
          if (timeLeft > 30) {
            nextIndex = (activeIndex + 1) % drums.length;
          } else {
            do { nextIndex = Math.floor(Math.random() * drums.length); } while (nextIndex === activeIndex);
          }

          // Son bir kez daha güvenli mesafe kontrolüyle konumlandır
          drums.forEach((drum, idx) => { if (idx !== activeIndex) randomizeDrumWithoutOverlap(drum, idx); });
        } 
        
        else if (currentCycleBeat === 3) {
          playMetronomeSound(300);
          isTransitioning = true;

          buildDynamicLine(drums[activeIndex], drums[nextIndex]);
          animateTransition(activeIndex, nextIndex, BEAT_DURATION * 2); 
        }
        
        else if (currentCycleBeat === 4) {
          playMetronomeSound(300);
        }

        beatCount++;

        if (currentCycleBeat === 4) {
          setTimeout(() => {
            dynamicLine.setAttribute('material', 'opacity', '0');
            dynamicLine.setAttribute('position', '0 0 -100');
            activeIndex = nextIndex;
          }, BEAT_DURATION - 30);
        }
      }

      function buildDynamicLine(drumA, drumB) {
        let posA = drumA.getAttribute('position');
        let posB = drumB.getAttribute('position');

        let midX = (posA.x + posB.x) / 2;
        let midY = (posA.y + posB.y) / 2;
        
        let dx = posB.x - posA.x;
        let dy = posB.y - posA.y;
        let distance = Math.sqrt(dx*dx + dy*dy);
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);

        dynamicLine.setAttribute('position', {x: midX, y: midY, z: FIXED_Z + 0.02});
        dynamicLine.setAttribute('height', distance);
        dynamicLine.setAttribute('rotation', `0 0 ${angle - 90}`);
        dynamicLine.setAttribute('material', 'opacity', '0.9');
      }

      function animateTransition(oldIdx, newIdx, duration) {
        let startTime = performance.now();

        function step(now) {
          let progress = (now - startTime) / duration;
          if (progress > 1) progress = 1;

          let oldScale = 1 - progress;
          masks[oldIdx].setAttribute('scale', `${oldScale} ${oldScale} 1`);

          let newScale = progress;
          masks[newIdx].setAttribute('scale', `${newScale} ${newScale} 1`);

          if (progress < 1 && isTransitioning) {
            requestAnimationFrame(step);
          } else {
            masks[oldIdx].setAttribute('scale', '0 0 1');
            masks[newIdx].setAttribute('scale', '1 1 1');
          }
        }
        requestAnimationFrame(step);
      }

      function setupScoreDetection() {
        const targets = document.querySelectorAll('.targetable');
        targets.forEach(target => {
          target.addEventListener('mouseenter', () => { currentTargetObject = target; });
          target.addEventListener('mouseleave', () => { if (currentTargetObject === target) currentTargetObject = null; });
        });

        scoreInterval = setInterval(() => {
          if (!currentTargetObject || timeLeft <= 0) return;
          let currentCycleBeat = ((beatCount - 1) % 4) + 1;

          if (currentCycleBeat === 1 || currentCycleBeat === 2) {
            if (currentTargetObject === drums[activeIndex]) score += 10;
          } else {
            if (currentTargetObject === dynamicLine) score += 5;
            if (currentTargetObject === drums[nextIndex]) score += 10;
          }
          uiScore.textContent = score;
        }, 100);
      }

      function endGame() {
        clearInterval(gameInterval);
        clearInterval(beatInterval);
        clearInterval(scoreInterval);
        if (wakeLock !== null) {
          wakeLock.release().then(() => { wakeLock = null; });
        }
        masks.forEach(m => m.setAttribute('scale', '0 0 1'));
        dynamicLine.setAttribute('material', 'opacity', '0');
        alert(`Egzersiz Tamamlandı!\nToplam Skorunuz: ${score}`);
      }
    </script>
  </body>
</html>
