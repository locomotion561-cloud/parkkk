<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Parkinson İleri Düzey Rehabilitasyon</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a237e; color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; font-family: sans-serif; text-align: center;
      }
      #ui-overlay {
        position: fixed; top: 10px; left: 10px; color: #1a237e;
        font-family: sans-serif; font-size: 20px; font-weight: bold;
        z-index: 999; pointer-events: none; background: rgba(255,255,255,0.8);
        padding: 10px; border-radius: 8px;
      }
      button {
        padding: 15px 30px; font-size: 18px; border: none;
        border-radius: 25px; background: #ff6f00; color: white;
        cursor: pointer; margin-top: 20px; font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div id="ui-overlay" style="display: none;">
      <div>Süre: <span id="ui-timer">60</span> sn</div>
      <div>Mod: <span id="ui-mode">Sıralı</span></div>
      <div>Skor: <span id="ui-score">0</span></div>
    </div>

    <div id="start-screen">
      <h2>Parkinson Ritim & Akıllı Geçiş Egzersizi</h2>
      <p style="max-width: 400px; padding: 0 20px;">
        Ritime odaklanın! 3. vuruştaki geçiş anında beliren <b>kalın çizgiyi</b> takip ederek yeni davula geçiş yapın ve puanları toplayın!
      </p>
      <button id="start-btn">EGZERSİZİ BAŞLAT</button>
    </div>

    <a-scene vr-mode-ui="enabled: false">
      <a-sky color="#ECEFF1"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#CFD8DC"></a-plane>

      <a-cylinder id="drum-0" class="drum targetable" position="-2.2 2.2 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-0" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-cylinder id="drum-1" class="drum targetable" position="2.2 2.2 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-1" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-cylinder id="drum-2" class="drum targetable" position="2.2 0.8 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-2" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>

      <a-cylinder id="drum-3" class="drum targetable" position="-2.2 0.8 -4" radius="0.4" height="0.05" rotation="90 0 0" color="#FBC02D">
        <a-circle id="mask-3" radius="0.4" position="0 0 0.03" color="#388E3C" scale="0 0 1"></a-circle>
      </a-cylinder>


      <a-box id="line-0-1" class="line targetable" position="0 2.2 -3.95" width="3.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-1-2" class="line targetable" position="2.2 1.5 -3.95" width="0.12" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-2-3" class="line targetable" position="0 0.8 -3.95" width="3.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-3-0" class="line targetable" position="-2.2 1.5 -3.95" width="0.12" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      
      <a-box id="line-0-2" class="line targetable" position="0 1.5 -3.95" rotation="0 0 -17" width="4.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-1-3" class="line targetable" position="0 1.5 -3.95" rotation="0 0 17" width="4.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      
      <a-box id="line-0-3" class="line targetable" position="-2.2 1.5 -3.95" width="0.12" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box> <a-box id="line-1-0" class="line targetable" position="0 2.2 -3.95" width="3.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-2-1" class="line targetable" position="2.2 1.5 -3.95" width="0.12" height="1.4" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-3-2" class="line targetable" position="0 0.8 -3.95" width="3.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-2-0" class="line targetable" position="0 1.5 -3.95" rotation="0 0 -17" width="4.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>
      <a-box id="line-3-1" class="line targetable" position="0 1.5 -3.95" rotation="0 0 17" width="4.6" height="0.12" depth="0.01" material="color: #2196F3; opacity: 0; transparent: true"></a-box>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" position="0 1.5 0">
        <a-cursor 
          id="my-cursor"
          raycaster="objects: .targetable; interval: 20" 
          fuse="false"
          color="#D50000"
          scale="2 2 2">
        </a-cursor>
      </a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const uiOverlay = document.getElementById('ui-overlay');
      const uiTimer = document.getElementById('ui-timer');
      const uiMode = document.getElementById('ui-mode');
      const uiScore = document.getElementById('ui-score');

      let score = 0;
      let timeLeft = 60;
      let gameInterval, beatInterval, scoreInterval;
      let audioCtx = null;
      
      const drums = [
        document.getElementById('drum-0'),
        document.getElementById('drum-1'),
        document.getElementById('drum-2'),
        document.getElementById('drum-3')
      ];

      const masks = [
        document.getElementById('mask-0'),
        document.getElementById('mask-1'),
        document.getElementById('mask-2'),
        document.getElementById('mask-3')
      ];

      let activeIndex = 0;
      let nextIndex = 1;
      let beatCount = 0;
      let currentTargetObject = null;
      let activeLine = null;

      startBtn.addEventListener('click', () => {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(state => {
            if (state === 'granted') initGame();
            else alert('Jiroskop izni gerekli!');
          }).catch(console.error);
        } else {
          initGame();
        }
      });

      function initGame() {
        startScreen.style.display = 'none';
        uiOverlay.style.display = 'block';
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // İlk davulu oyun başında anında tam yeşil yap
        masks[activeIndex].setAttribute('animation', 'property: scale; to: 1 1 1; dur: 0; easing: linear; fill: forwards');

        gameInterval = setInterval(updateTimer, 1000);
        beatInterval = setInterval(handleBeat, 1000); // 60 BPM
        setupScoreDetection();
      }

      function playMetronomeSound(pitch) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime); 
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      }

      function updateTimer() {
        timeLeft--;
        uiTimer.textContent = timeLeft;
        if (timeLeft <= 30) uiMode.textContent = "Rastgele";
        if (timeLeft <= 0) endGame();
      }

      function handleBeat() {
        let currentCycleBeat = (beatCount % 3) + 1; // 1, 2 veya 3. vuruş

        if (currentCycleBeat === 1) {
          // 1. Vuruş: Normal ritim sesi, mevcut davul tam yeşil kalmaya devam eder
          playMetronomeSound(150);
        } 
        
        else if (currentCycleBeat === 2) {
          // 2. Vuruş: Bir sonraki vuruşta geçiş olacağı için bir sonraki hedef davul endeksini şimdiden hesapla
          playMetronomeSound(150);
          calculateNextTarget();
        } 
        
        else if (currentCycleBeat === 3) {
          // 3. Vuruş: GEÇİŞ FAZI BAŞLADI (Fade In / Fade Out)
          playMetronomeSound(300); // Uyarıcı yüksek ton

          // A. Eski Davul Küçülüyor (1 saniye içinde merkezde nokta olup yok olacak)
          masks[activeIndex].removeAttribute('animation');
          masks[activeIndex].setAttribute('animation', 'property: scale; from: 1 1 1; to: 0 0 1; dur: 1000; easing: linear; fill: forwards');

          // B. Yeni Davul Büyüyor (Merkezden dışarı doğru yeşilleniyor)
          masks[nextIndex].removeAttribute('animation');
          masks[nextIndex].setAttribute('animation', 'property: scale; from: 0 0 1; to: 1 1 1; dur: 1000; easing: linear; fill: forwards');

          // C. Sadece İlgili Çizgi Beliriyor (Fade In)
          let lineId = `line-${activeIndex}-${nextIndex}`;
          activeLine = document.getElementById(lineId);
          if (activeLine) {
            activeLine.setAttribute('animation', 'property: material.opacity; from: 0; to: 0.9; dur: 300; easing: linear; fill: forwards');
          }
        }

        beatCount++;
        
        // 3 vuruş bittiğinde resmi olarak yeni davula geçmiş oluyoruz
        if (currentCycleBeat === 3) {
          // Bir sonraki vuruş döngüsü başlamadan hemen önce eski çizgiyi kapat (Fade Out)
          setTimeout(() => {
            if (activeLine) {
              activeLine.removeAttribute('animation');
              activeLine.setAttribute('animation', 'property: material.opacity; from: 0.9; to: 0; dur: 200; easing: linear; fill: forwards');
            }
            // Endeksleri güncelle
            activeIndex = nextIndex;
          }, 980);
        }
      }

      function calculateNextTarget() {
        if (timeLeft > 30) {
          // Sıralı Mod
          nextIndex = (activeIndex + 1) % drums.length;
        } else {
          // Rastgele Mod
          do {
            nextIndex = Math.floor(Math.random() * drums.length);
          } while (nextIndex === activeIndex);
        }
      }

      function setupScoreDetection() {
        const targets = document.querySelectorAll('.targetable');
        
        targets.forEach(target => {
          target.addEventListener('mouseenter', () => { currentTargetObject = target; });
          target.addEventListener('mouseleave', () => { if (currentTargetObject === target) currentTargetObject = null; });
        });

        // 100ms Puanlama Döngüsü
        scoreInterval = setInterval(() => {
          if (!currentTargetObject || timeLeft <= 0) return;

          let currentCycleBeat = ((beatCount - 1) % 3) + 1;

          // 1. veya 2. vuruşta isek: Puan sadece tam yeşil olan aktif davuldan alınır
          if (currentCycleBeat !== 3) {
            if (currentTargetObject === drums[activeIndex]) {
              score += 10;
            }
          } 
          // 3. vuruşta (GEÇİŞ ANINDA) isek:
          else {
            // A. Eğer imleç beliren çizginin üzerindeyse puan ver (+5)
            if (currentTargetObject === activeLine) {
              score += 5;
            }
            // B. Eğer hasta erkenden veya zamanında yeni büyüyen davula ulaştıysa puan ver (+10)
            if (currentTargetObject === drums[nextIndex]) {
              score += 10;
            }
          }
          uiScore.textContent = score;
        }, 100);
      }

      function endGame() {
        clearInterval(gameInterval);
        clearInterval(beatInterval);
        clearInterval(scoreInterval);
        masks.forEach(m => m.setAttribute('scale', '0 0 1'));
        document.querySelectorAll('.line').forEach(l => l.setAttribute('material', 'opacity', '0'));
        alert(`Egzersiz Bitti!\nToplam Skor: ${score}`);
      }
    </script>
  </body>
</html>
