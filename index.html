<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Zen VR - Parkinson Kesin Mesafe Onaylı</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Azeret+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --zen-green: #6d8c7c;
        }

        body { margin: 0; overflow: hidden; font-family: 'Poppins', sans-serif; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #f5e6d3 0%, #dcd0b9 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; text-align: center;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            width: 80%; max-width: 450px;
            color: #4a4238;
        }

        h2 { font-weight: 700; margin-top: 0; margin-bottom: 10px; letter-spacing: -1px; }
        p { font-size: 14px; opacity: 0.8; margin-bottom: 25px; }

        .menu-group { margin: 20px 0; text-align: left; }
        label { font-size: 13px; font-weight: 500; margin-left: 5px; color: #6d6255; }

        select {
            width: 100%; padding: 14px; font-size: 16px; border-radius: 15px;
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.7);
            color: #4a4238; font-family: 'Poppins'; outline: none; margin-top: 6px;
            font-weight: bold; cursor: pointer;
        }

        button {
            width: 100%; padding: 18px; font-size: 18px; border: none;
            border-radius: 18px; background: var(--zen-green); color: white;
            cursor: pointer; margin-top: 15px; font-weight: 700;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(109, 140, 124, 0.3);
        }
        button:hover { background: #5a7567; }
        button:active { transform: scale(0.97); }

        #ui-overlay {
            position: fixed; top: 20px; left: 20px;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 20px; border: 1px solid var(--glass-border);
            color: #4a4238; font-family: 'Azeret Mono', monospace; font-size: 15px;
            z-index: 999; display: none; line-height: 1.5;
        }
        .score-val { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div>SÜRE: <span id="ui-timer">60</span> sn</div>
        <div>SKOR: <span id="ui-score" class="score-val">0</span></div>
    </div>

    <div id="start-screen">
        <div class="glass-panel">
            <h2>ZEN REHABILITATION</h2>
            <p>Doğal materyaller ve sakinleştirici ritimle motor beceri egzersizi.</p>
            
            <div class="menu-group">
                <label for="bpm-select">Metronom Tempo (Hız)</label>
                <select id="bpm-select">
                    <option value="30">30 BPM - Çok Sakin / Ağır Rijidite</option>
                    <option value="40" selected>40 BPM - Standart Klinik Seans</option>
                    <option value="50">50 BPM - Dinamik Koordinasyon</option>
                    <option value="60">60 BPM - İleri Düzey Takip</option>
                </select>
            </div>

            <div class="menu-group">
                <label for="size-select">Hedef Daire Boyutu</label>
                <select id="size-select">
                    <option value="0.55">Geniş (Kolay Odaklanma)</option>
                    <option value="0.40" selected>Normal (Klinik Standart)</option>
                    <option value="0.28">Dar (İnce Tremor Kontrolü)</option>
                </select>
            </div>

            <button id="start-btn">ODAKLAN VE BAŞLAT</button>
        </div>
    </div>

    <a-scene vr-mode-ui="enabled: false">
        <a-assets>
            <img id="zen-sky" src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=2048&q=80">
            <img id="wood-tex" src="https://images.unsplash.com/photo-1541123437800-1bb1317badc2?auto=format&fit=crop&w=500&q=80">
            <img id="arrow-flow" src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Linear_arrows_pattern.png">
        </a-assets>

        <a-sky src="#zen-sky" rotation="0 -90 0" color="#f5f5dc"></a-sky>
        
        <a-light type="ambient" color="#f5f5dc" intensity="0.7"></a-light>
        <a-light type="directional" position="2 4 -3" intensity="0.5" color="#fffaf0"></a-light>

        <a-entity id="drum-group">
            <a-circle id="drum-0" class="drum targetable" material="src: #wood-tex; roughness: 0.9" radius="0.4" position="0 1.6 -4">
                <a-ring color="#4a4238" radius-inner="0.39" radius-outer="0.42" position="0 0 0.01"></a-ring>
                <a-circle id="mask-0" color="#6d8c7c" radius="0.4" scale="0 0 1" position="0 0 0.02" material="emissive: #6d8c7c; emissiveIntensity: 0"></a-circle>
            </a-circle>

            <a-circle id="drum-1" class="drum targetable" material="src: #wood-tex; roughness: 0.9" radius="0.4" position="-1 1.6 -4">
                <a-ring color="#4a4238" radius-inner="0.39" radius-outer="0.42" position="0 0 0.01"></a-ring>
                <a-circle id="mask-1" color="#6d8c7c" radius="0.4" scale="0 0 1" position="0 0 0.02" material="emissive: #6d8c7c; emissiveIntensity: 0"></a-circle>
            </a-circle>

            <a-circle id="drum-2" class="drum targetable" material="src: #wood-tex; roughness: 0.9" radius="0.4" position="1 1.6 -4">
                <a-ring color="#4a4238" radius-inner="0.39" radius-outer="0.42" position="0 0 0.01"></a-ring>
                <a-circle id="mask-2" color="#6d8c7c" radius="0.4" scale="0 0 1" position="0 0 0.02" material="emissive: #6d8c7c; emissiveIntensity: 0"></a-circle>
            </a-circle>

            <a-circle id="drum-3" class="drum targetable" material="src: #wood-tex; roughness: 0.9" radius="0.4" position="0 2.5 -4">
                <a-ring color="#4a4238" radius-inner="0.39" radius-outer="0.42" position="0 0 0.01"></a-ring>
                <a-circle id="mask-3" color="#6d8c7c" radius="0.4" scale="0 0 1" position="0 0 0.02" material="emissive: #6d8c7c; emissiveIntensity: 0"></a-circle>
            </a-circle>
        </a-entity>

        <a-box id="dynamic-line" class="targetable" width="0.22" height="1" depth="0.01" 
               material="src: #arrow-flow; repeat: 1 4; transparent: true; opacity: 0; color: #6d8c7c" 
               position="0 0 -100"></a-box>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" position="0 1.6 0">
            <a-cursor id="my-cursor" raycaster="objects: .targetable; interval: 15" fuse="false" color="#4a4238" scale="2.5 2.5 2.5"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const uiOverlay = document.getElementById('ui-overlay');
        const uiTimer = document.getElementById('ui-timer');
        const uiScore = document.getElementById('ui-score');

        let score = 0, timeLeft = 60;
        let gameInterval, beatInterval, scoreInterval, wakeLock = null;
        let audioCtx = null;
        
        const drums = Array.from(document.querySelectorAll('.drum'));
        const masks = Array.from(document.querySelectorAll('a-circle[id^="mask-"]'));
        const dynamicLine = document.getElementById('dynamic-line');

        let activeIndex = 0, nextIndex = 1, beatCount = 0;
        let currentTargetObject = null, isTransitioning = false;

        let BEAT_DURATION = 1500, DRUM_RADIUS = 0.40, MIN_DIST = 1.8;
        const FIXED_Z = -4;

        startBtn.addEventListener('click', async () => {
            BEAT_DURATION = (60 / parseInt(document.getElementById('bpm-select').value)) * 1000;
            DRUM_RADIUS = parseFloat(document.getElementById('size-select').value);
            
            // İki dairenin merkezleri arasındaki GÜVENLİ MİNİMUM MESAFE: 
            // 2 Daire Çapı Boşluk + Dairelerin Kendi Yarıçapları = Toplamda Yarıçapın en az 5 Katı olmalı.
            MIN_DIST = DRUM_RADIUS * 5.2;

            drums.forEach((drum, idx) => {
                drum.setAttribute('radius', DRUM_RADIUS);
                masks[idx].setAttribute('radius', DRUM_RADIUS);
                drum.querySelector('a-ring').setAttribute('radius-inner', DRUM_RADIUS - 0.01);
                drum.querySelector('a-ring').setAttribute('radius-outer', DRUM_RADIUS + 0.02);
            });

            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => { if (state === 'granted') initGame(); });
            } else { initGame(); }
        });

        function initGame() {
            startScreen.style.display = 'none';
            uiOverlay.style.display = 'block';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // İlk daireyi merkeze oturt
            drums[activeIndex].setAttribute('position', {x: 0, y: 1.6, z: FIXED_Z});
            masks[activeIndex].setAttribute('scale', '1 1 1');
            masks[activeIndex].setAttribute('material', 'emissiveIntensity', '0.4');

            // Tüm sahneyi çakışmasız dağıtarak oyunu başlat
            repositionAllNonActiveDrums();

            gameInterval = setInterval(() => { timeLeft--; uiTimer.textContent = timeLeft; if (timeLeft <= 0) endGame(); }, 1000);
            beatInterval = setInterval(handleBeat, BEAT_DURATION);
            setupScoreDetection();
        }

        // TAM KORUMALI ARAR BULUR GLOBAL DAĞITIM MOTORU
        function repositionAllNonActiveDrums() {
            // Aktif olmayan daireleri sırayla temiz alanlara yerleştiriyoruz
            drums.forEach((drum, idx) => {
                if (idx === activeIndex) return; // Aktif olanın yerini koru

                let valid = false;
                let x, y, attempts = 0;

                while (!valid && attempts < 400) {
                    attempts++;
                    valid = true;
                    
                    // Görüş açısına uygun rastgele konum üret
                    x = Math.random() * 4.0 - 2.0; 
                    y = Math.random() * 1.6 + 0.8; 

                    // Şu ana kadar sahneye yerleşmiş TÜM DAİRELERİ kontrol et
                    for (let i = 0; i < drums.length; i++) {
                        if (i === idx) continue; // Kendini kontrol etme

                        let otherPos = drums[i].getAttribute('position');
                        if (!otherPos) continue;

                        let dX = x - otherPos.x;
                        let dY = y - otherPos.y;
                        let distance = Math.sqrt(dX * dX + dY * dY);

                        // Eğer herhangi birine belirlenen güvenli mesafeden yakınsa bu konumu iptal et
                        if (distance < MIN_DIST) {
                            valid = false;
                            break;
                        }
                    }
                }
                // Güvenli yer bulunduğunda ata
                drum.setAttribute('position', {x: x, y: y, z: FIXED_Z});
            });
        }

        function playMetronomeSound(pitch) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime); 
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function handleBeat() {
            let cycle = (beatCount % 4) + 1;
            
            if (cycle === 1) {
                isTransitioning = false;
                playMetronomeSound(160);
                masks.forEach((m, idx) => {
                    m.setAttribute('scale', idx === activeIndex ? '1 1 1' : '0 0 1');
                    m.setAttribute('material', 'emissiveIntensity', idx === activeIndex ? '0.4' : '0');
                });
                // 1. Vuruş başında tüm pasifleri yeni yerlerine tam güvenli mesafeyle uçur
                repositionAllNonActiveDrums();
            } 
            
            else if (cycle === 2) {
                playMetronomeSound(160);
                if (timeLeft > 30) {
                    nextIndex = (activeIndex + 1) % 4;
                } else {
                    do { nextIndex = Math.floor(Math.random() * 4); } while (nextIndex === activeIndex);
                }
                // Karar verildikten sonra, çakışma ihtimaline karşı konumları son kez tazele
                repositionAllNonActiveDrums();
            } 
            
            else if (cycle === 3) {
                playMetronomeSound(280);
                isTransitioning = true;
                buildDynamicLine(drums[activeIndex], drums[nextIndex]);
                animateTransition(activeIndex, nextIndex, BEAT_DURATION * 2);
            }
            
            else if (cycle === 4) {
                playMetronomeSound(280);
            }

            beatCount++;

            if (cycle === 4) {
                setTimeout(() => {
                    dynamicLine.setAttribute('material', 'opacity', '0');
                    dynamicLine.setAttribute('position', '0 0 -100');
                    activeIndex = nextIndex;
                }, BEAT_DURATION - 50);
            }
        }

        function buildDynamicLine(drumA, drumB) {
            let pA = drumA.getAttribute('position'), pB = drumB.getAttribute('position');
            let dist = Math.sqrt((pB.x - pA.x)**2 + (pB.y - pA.y)**2);
            let angle = Math.atan2(pB.y - pA.y, pB.x - pA.x) * (180 / Math.PI);

            dynamicLine.setAttribute('position', {x: (pA.x+pB.x)/2, y: (pA.y+pB.y)/2, z: FIXED_Z + 0.03});
            dynamicLine.setAttribute('height', dist);
            dynamicLine.setAttribute('rotation', `0 0 ${angle - 90}`);
            dynamicLine.setAttribute('material', 'opacity', '0.8');
            
            dynamicLine.removeAttribute('animation__flow');
            dynamicLine.setAttribute('animation__flow', `property: material.offset.y; from: 0; to: -4; dur: 2500; easing: linear; loop: true`);
        }

        function animateTransition(oldIdx, newIdx, dur) {
            let start = performance.now();
            function step(now) {
                let p = (now - start) / dur; if (p > 1) p = 1;
                masks[oldIdx].setAttribute('scale', `${1-p} ${1-p} 1`);
                masks[oldIdx].setAttribute('material', 'emissiveIntensity', (1-p)*0.4);
                masks[newIdx].setAttribute('scale', `${p} ${p} 1`);
                masks[newIdx].setAttribute('material', 'emissiveIntensity', p*0.4);
                if (p < 1 && isTransitioning) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function setupScoreDetection() {
            drums.concat(dynamicLine).forEach(t => {
                t.addEventListener('mouseenter', () => currentTargetObject = t);
                t.addEventListener('mouseleave', () => currentTargetObject = null);
            });

            scoreInterval = setInterval(() => {
                if (!currentTargetObject || timeLeft <= 0) return;
                let c = ((beatCount - 1) % 4) + 1;
                if (c <= 2 && currentTargetObject === drums[activeIndex]) score += 10;
                else if (c > 2) {
                    if (currentTargetObject === dynamicLine) score += 6;
                    if (currentTargetObject === drums[nextIndex]) score += 10;
                }
                uiScore.textContent = score;
            }, 100);
        }

        function endGame() {
            clearInterval(gameInterval); clearInterval(beatInterval); clearInterval(scoreInterval);
            if (wakeLock) { wakeLock.release().then(() => { wakeLock = null; }); }
            alert(`Seans Başarıyla Tamamlandı.\nToplam Skorunuz: ${score}`);
            location.reload();
        }
    </script>
</body>
</html>
